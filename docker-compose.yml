services:
  cloud:
    build: .
    container_name: cloud
    restart: unless-stopped
    # Soubory na disku patří tomuhle uživateli hostitele, ne rootovi.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # Domácí server: dostupné z LAN i přes Tailscale. Jen z tohohle stroje = BIND_ADDRESS=127.0.0.1
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"
    volumes:
      - ${CLOUD_DIR:-/srv/cloud}:/cloud
      - ./data:/data
